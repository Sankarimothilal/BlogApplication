<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSphere - Forgot Password</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navbar matching mockup -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        BlogSphere
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
      </ul>
      <div>
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
      </div>
    </div>
  </header>

  <!-- Forgot Password Card (Screen 4 Mockup) -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Forgot Password</h2>
      <p class="auth-subtitle">Enter your email and we will send you a link to reset your password.</p>

      <div id="status-msg" style="display:none; padding:10px; border-radius:6px; font-size:0.85rem; margin-bottom:14px;"></div>

      <form class="auth-form" id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; font-size:0.95rem;">Send Reset Link</button>
      </form>

      <div class="auth-footer">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const statusBox = document.getElementById('status-msg');

      try {
        await request('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        statusBox.style.display = 'block';
        statusBox.style.background = '#dcfce7';
        statusBox.style.color = '#15803d';
        statusBox.textContent = `A reset link has been dispatched to ${email}. Check your inbox!`;
      } catch (err) {
        statusBox.style.display = 'block';
        statusBox.style.background = '#dcfce7';
        statusBox.style.color = '#15803d';
        statusBox.textContent = `If that email exists in our records, a reset link was sent to ${email}.`;
      }
    });

    updateThemeIcon();
  </script>
</body>
</html>
