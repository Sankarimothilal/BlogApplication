<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSphere - Categories</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar" id="main-navbar"></header>

  <main class="main-content">
    <div class="container" style="max-width: 760px;">
      
      <!-- Categories Card List (Screen 11 Mockup) -->
      <div class="categories-container">
        <h2 class="section-title" style="margin-bottom:24px;">Categories</h2>

        <div class="categories-list" id="categories-list-container">
          <!-- Populated by JS -->
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar('categories');

      const iconsMap = {
        technology: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>`,
        education: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>`,
        business: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>`,
        lifestyle: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
        travel: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>`
      };

      try {
        const categories = await API.categories.getAll();
        const container = document.getElementById('categories-list-container');

        container.innerHTML = categories.map(cat => {
          const key = cat.slug.toLowerCase();
          const icon = iconsMap[key] || iconsMap.technology;

          return `
            <a href="index.html?category=${cat.slug}" class="category-row">
              <div class="category-row-left">
                <span class="category-row-icon">${icon}</span>
                <span>${cat.name}</span>
              </div>
              <span class="category-row-count">(${cat.postCount || 10})</span>
            </a>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    });
  </script>
</body>
</html>
