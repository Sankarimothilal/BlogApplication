<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSphere - Notifications</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar" id="main-navbar"></header>

  <main class="main-content">
    <div class="container" style="max-width: 760px;">
      
      <!-- Notifications Container (Screen 12 Mockup) -->
      <div class="notifications-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2 class="section-title" style="margin-bottom:0;">Notifications</h2>
          <button class="btn btn-outline btn-sm" onclick="markAllRead()">Mark all as read</button>
        </div>

        <div class="notification-list" id="notification-list-container">
          <!-- Populated by JS -->
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderNavbar();

      const icons = {
        LIKE: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
        COMMENT: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
        FOLLOW: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>`,
        NEW_POST: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>`
      };

      try {
        const notifications = await API.notifications.getAll();
        const container = document.getElementById('notification-list-container');

        if (!notifications || notifications.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No notifications yet.</p>';
          return;
        }

        container.innerHTML = notifications.map(n => {
          const icon = icons[n.type] || icons.NEW_POST;
          return `
            <div class="notification-row ${!n.isRead ? 'unread' : ''}">
              <div class="notification-icon-badge">${icon}</div>
              <div class="notification-content">
                <p>${n.message}</p>
                <span>${n.timeAgo || formatTimeAgo(n.createdAt)}</span>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load notifications:', err);
      }
    });

    function markAllRead() {
      document.querySelectorAll('.notification-row.unread').forEach(el => el.classList.remove('unread'));
      alert('All notifications marked as read.');
    }
  </script>
</body>
</html>
