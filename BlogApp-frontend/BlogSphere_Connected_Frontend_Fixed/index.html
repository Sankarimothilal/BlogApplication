<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlogSphere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="#" onclick="app.home();return false"><span class="brand-mark">B</span> BlogSphere</a>
    <div class="top-actions">
      <button class="ghost" id="themeBtn" title="Toggle theme">☾</button>
      <button class="ghost" id="loginBtn">Login</button>
      <button class="primary" id="registerBtn">Create account</button>
      <span id="userMenu" class="hidden"></span>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <button class="nav active" data-view="home">⌂ &nbsp; Home</button>
      <button class="nav" data-view="dashboard">▦ &nbsp; Dashboard</button>
      <button class="nav" data-view="write">✎ &nbsp; Write a blog</button>
      <button class="nav" data-view="bookmarks">▢ &nbsp; Bookmarks</button>
      <button class="nav" data-view="following">♡ &nbsp; Following</button>
      <div class="side-label">EXPLORE</div>
      <button class="nav" data-category="Technology">Technology</button>
      <button class="nav" data-category="Education">Education</button>
      <button class="nav" data-category="Lifestyle">Lifestyle</button>
      <button class="nav" data-category="Travel">Travel</button>
      <button class="nav" data-category="Business">Business</button>
      <div class="side-note">Ideas are meant to be shared.</div>
    </aside>
    <main id="main">
      <section class="hero">
        <p class="eyebrow">A SPACE FOR IDEAS</p>
        <h1>Read something meaningful.<br><span>Share something yours.</span></h1>
        <p>Stories, perspectives, and ideas from people who love to write.</p>
        <div class="hero-row">
          <input id="searchInput" placeholder="Search articles, topics, authors…" aria-label="Search blogs">
          <button class="primary" id="searchBtn">Search</button>
        </div>
      </section>
      <div class="section-heading"><h2 id="feedTitle">Latest stories</h2><button class="ghost" id="refreshBtn">↻ Refresh</button></div>
      <div id="blogGrid" class="blog-grid"></div>
      <div id="emptyState" class="empty hidden">No stories found. Try another search or write the first story.</div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
